[package]
name = "lookout-macos"
description = "Lookout for macOS: menu bar app that arranges AI terminal windows"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "Lookout"
path = "src/main.rs"

[dependencies]
lookout-core = { path = "../core" }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.5"
objc2-foundation = "=0.3.2"
objc2-app-kit = "=0.3.2"
