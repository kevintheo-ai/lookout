[package]
name = "lookout-core"
description = "Platform-neutral logic of Lookout: layout, session status, window matching"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# Local time for one-shot cron wake-ups and Codex's day folders (Swift: Calendar.current, DateFormatter).
chrono = { version = "=0.4.45", default-features = false, features = ["clock"] }
serde_json = "=1.0.154"
